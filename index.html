<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tealive Voucher Retrieval</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f4f6f9; margin: 0; padding: 20px 0; }
        .card { background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 92%; max-width: 420px; text-align: center; margin-bottom: 20px; box-sizing: border-box; }

        h2 { color: #ee4d2d; margin-bottom: 8px; font-size: 22px; }
        h3 { color: #333; font-size: 16px; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 15px; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #e1e4e8; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
        input:focus { border-color: #ee4d2d; }
        button { width: 100%; padding: 14px; background: #ee4d2d; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #d73211; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #result { margin-top: 20px; font-size: 15px; word-break: break-all; line-height: 1.6; }
        .success { color: #2e7d32; font-weight: bold; }
        .error { color: #d32f2f; font-weight: bold; }
        .link-box { background: #f9f9f9; padding: 14px; border-radius: 8px; border: 1px dashed #ee4d2d; margin-top: 12px; }
        .copy-btn { margin-top: 10px; background: #2196F3; padding: 10px; font-size: 14px; width: 100%; }
        .copy-btn:hover { background: #1976D2; }
        a { color: #ee4d2d; font-weight: bold; text-decoration: none; }

        /* 响应式视频容器 */
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-top: 10px; background: #000; }
        .video-container iframe { position: absolute; top:0; left: 0; width: 100%; height: 100%; border: 0; border-radius: 8px; }
        .video-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #222; color: #fff; border-radius: 8px; }
        .video-placeholder span { font-size: 32px; margin-bottom: 8px; }
        .video-placeholder p { color: #ccc; font-size: 13px; margin: 0; }
    </style>
</head>
<body>

<!-- 1. 顶部：Tealive 提卡查询区域 -->
<div class="card">
    <h2>Tealive Voucher Retrieval</h2>
    <p>Enter your Shopee Order Serial No. below</p>

    <input type="text" id="orderId" placeholder="e.g. 260820U031H9CU">
    <button id="submitBtn" onclick="getLink()">Get My Link</button>
    <div id="result"></div>
</div>

<!-- 2. 底部：YouTube 视频教程区域 -->
<div class="card">
    <h3>📖 Video Tutorial / 视频教程</h3>
    <div class="video-container">
        <!-- <iframe src="https://www.youtube.com/embed/YOUR_YOUTUBE_VIDEO_ID" allowfullscreen></iframe> -->
        <div class="video-placeholder">
            <span>▶️</span>
            <p>Video Tutorial Coming Soon...</p>
        </div>
    </div>
</div>

<script>
    // Tealive 专属后端 Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbw8lso7xu-3ENdrlDh55qjqT-sMRaJKQjPnJ__GuEaUCdtncM9_GQCkAz-ZG8tMkGnx/exec"; 

    function getLink() {
        const orderIdInput = document.getElementById("orderId").value.trim();
        const resultDiv = document.getElementById("result");
        
        if(!orderIdInput) {
            resultDiv.innerHTML = "<span class='error'>Please enter a valid Order ID!</span>";
            return;
        }

        resultDiv.innerHTML = "<span style='color:#666;'>Checking order... Please wait.</span>";

        fetch(`${API_URL}?order_id=${encodeURIComponent(orderIdInput)}`)
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                resultDiv.innerHTML = `
                    <span class='success'>${data.message}</span>
                    <div class='link-box'>
                        <a href="${data.link}" id="voucherLink" target="_blank">${data.link}</a>
                        <button class="copy-btn" onclick="copyToClipboard('${data.link}')">📋 Copy Link</button>
                    </div>`;
            } else {
                resultDiv.innerHTML = `<span class='error'>${data.message}</span>`;
            }
        })
        .catch(err => {
            resultDiv.innerHTML = "<span class='error'>Network error. Please try again!</span>";
        });
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            const copyBtn = document.querySelector(".copy-btn");
            if (copyBtn) {
                copyBtn.innerText = "✅ Copied!";
                copyBtn.style.background = "#4CAF50";
                setTimeout(() => {
                    copyBtn.innerText = "📋 Copy Link";
                    copyBtn.style.background = "#2196F3";
                }, 2000);
            }
        }).catch(err => {
            alert("Copy failed, please long press the link to copy manually.");
        });
    }
</script>

</body>
</html>
